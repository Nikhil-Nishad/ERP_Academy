name: Blog Post Verification

on:
  push:
    branches: [dev]
    paths:
      - 'content/posts/**'
      - 'public/assets/blog_images/**'

  deployment_status:

# Required permissions for PR creation, merging, and branch management
permissions:
  contents: write
  pull-requests: write
  deployments: read

jobs:
  # Job 1: Create PR when blog content is pushed to dev
  create-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true  # Prevent auxiliary failures from blocking workflow
    outputs:
      pr_number: ${{ steps.create.outputs.pr_number }}
      slug: ${{ steps.extract.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract blog slug from commit
        id: extract
        run: |
          # Get changed files (with fallback for first commit)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files: $CHANGED"
          
          # Extract slug from MDX filename (with safe fallback)
          SLUG=$(echo "$CHANGED" | grep -oP 'content/posts/\K[^.]+' | head -1 || true)
          
          if [ -z "$SLUG" ]; then
            echo "No blog slug detected, continuing anyway"
            echo "slug=" >> $GITHUB_OUTPUT
          else
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "Extracted slug: $SLUG"
          fi

      - name: Check for existing PR
        id: check-pr
        run: |
          PR_NUM=$(gh pr list --base main --head dev --json number --jq '.[0].number // empty')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Existing PR: $PR_NUM"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create
        if: steps.check-pr.outputs.pr_number == ''
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          SLUG="${{ steps.extract.outputs.slug }}"
          
          PR_URL=$(gh pr create \
            --base main \
            --head dev \
            --title "🚀 $COMMIT_MSG" \
            --body "## 📝 Automated Blog Post

          **Slug:** \`$SLUG\`

          ### ⏳ Deployment Status
          _Waiting for Vercel deployment..._

          ### ✅ Verification Checklist
          - [ ] Vercel preview deployed
          - [ ] Blog article accessible
          - [ ] Blog image loading

          ### 🔗 Links (after deployment)
          - Preview: _pending_
          - Article: _pending_
          - Image: _pending_

          ---
          _Auto-generated by GitHub Actions_")
          
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output PR number
        run: |
          PR="${{ steps.check-pr.outputs.pr_number }}${{ steps.create.outputs.pr_number }}"
          echo "PR Number: $PR"

  # Job 2: Update PR when Vercel deployment completes
  verify-deployment:
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 10

      - name: Get deployment info
        id: deploy-info
        run: |
          DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://erp-academy-git-dev-nikhilnishads-projects.vercel.app"
          fi
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $DEPLOY_URL"

      - name: Find PR for dev branch
        id: find-pr
        run: |
          PR_NUM=$(gh pr list --base main --head dev --json number --jq '.[0].number // empty')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          
          if [ -z "$PR_NUM" ]; then
            echo "No PR found for dev -> main"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract slug from recent commits
        id: extract-slug
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          # Get the most recent MDX file from dev branch
          SLUG=$(git log --name-only --pretty=format: -10 | grep -oP 'content/posts/\K[^.]+' | head -1)
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Slug: $SLUG"

      - name: Verify blog article is accessible
        id: verify-article
        if: steps.find-pr.outputs.pr_number != '' && steps.extract-slug.outputs.slug != ''
        run: |
          DEPLOY_URL="${{ steps.deploy-info.outputs.deploy_url }}"
          SLUG="${{ steps.extract-slug.outputs.slug }}"
          
          ARTICLE_URL="${DEPLOY_URL}/blog/${SLUG}"
          echo "Checking article at: $ARTICLE_URL"
          
          # Wait for deployment to be fully ready
          sleep 15
          
          # Check if article is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ARTICLE_URL" --max-time 30 || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "article_status=✅ Article accessible" >> $GITHUB_OUTPUT
            echo "article_success=true" >> $GITHUB_OUTPUT
          else
            echo "article_status=❌ Article NOT accessible (HTTP $HTTP_STATUS)" >> $GITHUB_OUTPUT
            echo "article_success=false" >> $GITHUB_OUTPUT
          fi
          echo "article_url=$ARTICLE_URL" >> $GITHUB_OUTPUT

      - name: Verify blog image is accessible
        id: verify-image
        if: steps.find-pr.outputs.pr_number != '' && steps.extract-slug.outputs.slug != ''
        run: |
          DEPLOY_URL="${{ steps.deploy-info.outputs.deploy_url }}"
          SLUG="${{ steps.extract-slug.outputs.slug }}"
          
          IMAGE_URL="${DEPLOY_URL}/assets/blog_images/${SLUG}.webp"
          echo "Checking image at: $IMAGE_URL"
          
          # Check if image is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$IMAGE_URL" --max-time 30 || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "image_status=✅ Image accessible" >> $GITHUB_OUTPUT
            echo "image_success=true" >> $GITHUB_OUTPUT
          else
            echo "image_status=❌ Image NOT accessible (HTTP $HTTP_STATUS)" >> $GITHUB_OUTPUT
            echo "image_success=false" >> $GITHUB_OUTPUT
          fi
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT

      - name: Update PR with deployment status
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          PR_NUM="${{ steps.find-pr.outputs.pr_number }}"
          DEPLOY_URL="${{ steps.deploy-info.outputs.deploy_url }}"
          SLUG="${{ steps.extract-slug.outputs.slug }}"
          
          ARTICLE_STATUS="${{ steps.verify-article.outputs.article_status }}"
          ARTICLE_URL="${{ steps.verify-article.outputs.article_url }}"
          ARTICLE_SUCCESS="${{ steps.verify-article.outputs.article_success }}"
          
          IMAGE_STATUS="${{ steps.verify-image.outputs.image_status }}"
          IMAGE_URL="${{ steps.verify-image.outputs.image_url }}"
          IMAGE_SUCCESS="${{ steps.verify-image.outputs.image_success }}"
          
          # Determine overall status
          if [ "$ARTICLE_SUCCESS" = "true" ] && [ "$IMAGE_SUCCESS" = "true" ]; then
            EMOJI="✅"
            STATUS_MSG="All checks passed! Ready for merge."
            ALL_PASS="true"
          else
            EMOJI="⚠️"
            STATUS_MSG="Some checks need attention."
            ALL_PASS="false"
          fi
          
          # Update PR body
          gh pr edit "$PR_NUM" --body "## 📝 Automated Blog Post

          **Slug:** \`$SLUG\`

          ### $EMOJI Deployment Status
          $STATUS_MSG

          ### ✅ Verification Checklist
          - [x] Vercel preview deployed
          - [$([ "$ARTICLE_SUCCESS" = "true" ] && echo "x" || echo " ")] Blog article accessible
          - [$([ "$IMAGE_SUCCESS" = "true" ] && echo "x" || echo " ")] Blog image loading

          ### 🔗 Links
          | Resource | URL | Status |
          |----------|-----|--------|
          | Preview | [View]($DEPLOY_URL) | ✅ |
          | Article | [/blog/$SLUG]($ARTICLE_URL) | $ARTICLE_STATUS |
          | Image | [View]($IMAGE_URL) | $IMAGE_STATUS |

          ---
          _Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')_
          _Auto-generated by GitHub Actions_"
          
          # Add comment with detailed status
          gh pr comment "$PR_NUM" --body "### Deployment Verification $EMOJI

          | Check | Status |
          |-------|--------|
          | Vercel Deploy | ✅ Success |
          | Article URL | $ARTICLE_STATUS |
          | Image URL | $IMAGE_STATUS |
          
          **Preview:** $DEPLOY_URL
          
          $([ "$ALL_PASS" = "true" ] && echo "🎉 **All checks passed! Auto-merging...**" || echo "⚠️ **Please verify failed checks manually before merging.**")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR on success
        if: |
          steps.find-pr.outputs.pr_number != '' &&
          steps.verify-article.outputs.article_success == 'true' &&
          steps.verify-image.outputs.image_success == 'true'
        run: |
          PR_NUM="${{ steps.find-pr.outputs.pr_number }}"
          echo "✅ All checks passed! Auto-merging PR #$PR_NUM with squash..."
          
          # Squash merge keeps main branch clean with single commits
          gh pr merge "$PR_NUM" --squash --delete-branch
          
          echo "🎉 PR #$PR_NUM merged to main (squashed) and dev branch deleted!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recreate dev branch from main
        if: |
          steps.find-pr.outputs.pr_number != '' &&
          steps.verify-article.outputs.article_success == 'true' &&
          steps.verify-image.outputs.image_success == 'true'
        run: |
          # Wait for merge to complete
          sleep 5
          
          # Recreate dev branch from main for next n8n run
          git fetch origin main
          git push origin origin/main:refs/heads/dev
          
          echo "✅ dev branch recreated from main (ready for next blog post)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Handle failed deployments
  handle-failure:
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Find PR
        id: find-pr
        run: |
          PR_NUM=$(gh pr list --base main --head dev --json number --jq '.[0].number // empty')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: steps.find-pr.outputs.pr_number != ''
        run: |
          gh pr comment "${{ steps.find-pr.outputs.pr_number }}" --body "### ❌ Deployment Failed

          The Vercel preview deployment failed. Please check the build logs.
          
          **Do NOT merge until this is resolved.**"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
